name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04
            os: ubuntu-22.04
          - name: macOS 26 arm64
            os: macos-26
    env:
      SWIFT_VERSION: 6.3.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Swift support dependencies (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get remove -y libunwind-13-dev libunwind-14-dev
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libcurl4-openssl-dev \
            pkg-config \
            python3-lldb-13 \
            libunwind-dev

      - name: Install Linuxbrew GStreamer dependencies (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x /home/linuxbrew/.linuxbrew/bin/brew ]]; then
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install pkgconf gstreamer
          echo "LD_LIBRARY_PATH=${HOMEBREW_PREFIX}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "$GITHUB_ENV"

      - name: Install Swiftly (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLO https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --skip-install --quiet-shell-followup --assume-yes
          . "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"
          echo "${SWIFTLY_BIN_DIR:-$HOME/.swiftly/bin}" >> "$GITHUB_PATH"

      - name: Install Swiftly (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLO "https://download.swift.org/swiftly/linux/swiftly-$(uname -m).tar.gz"
          tar zxf "swiftly-$(uname -m).tar.gz"
          ./swiftly init --skip-install --quiet-shell-followup --assume-yes
          . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
          echo "${SWIFTLY_BIN_DIR:-$HOME/.local/share/swiftly/bin}" >> "$GITHUB_PATH"

      - name: Install Swift
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            . "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"
          else
            . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
          fi
          swiftly install --use "$SWIFT_VERSION" --assume-yes

      - name: Verify Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            . "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"
          else
            . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
          fi
          version_output="$(swiftly run swift --version)"
          printf '%s\n' "$version_output"
          case "$version_output" in
            *"Swift version $SWIFT_VERSION"*) ;;
            *)
              echo "Expected Swift $SWIFT_VERSION"
              exit 1
              ;;
          esac
          swiftly run which swift

      - name: Install GStreamer dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install pkgconf gstreamer

      - name: Preflight GStreamer dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          pkg-config --exists gstreamer-1.0 gstreamer-app-1.0 gstreamer-video-1.0 gstreamer-base-1.0
          printf 'gstreamer-1.0: %s\n' "$(pkg-config --modversion gstreamer-1.0)"
          printf 'gstreamer-app-1.0: %s\n' "$(pkg-config --modversion gstreamer-app-1.0)"
          printf 'gstreamer-video-1.0: %s\n' "$(pkg-config --modversion gstreamer-video-1.0)"
          printf 'gstreamer-base-1.0: %s\n' "$(pkg-config --modversion gstreamer-base-1.0)"
          pkg-config --atleast-version=1.28.2 gstreamer-1.0
          pkg-config --atleast-version=1.28.2 gstreamer-app-1.0
          pkg-config --atleast-version=1.28.2 gstreamer-video-1.0
          pkg-config --atleast-version=1.28.2 gstreamer-base-1.0
          gst-inspect-1.0 --version

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            . "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"
          fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          swiftly run swift build

      - name: Test serially
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            . "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"
          fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          swiftly run swift test --no-parallel

      - name: Dump public symbol graph
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            . "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"
          fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            . "${SWIFTLY_HOME_DIR:-$HOME/.local/share/swiftly}/env.sh"
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          swiftly run swift package dump-symbol-graph --minimum-access-level public --skip-synthesized-members
          symbol_graph="$(find .build -path '*/symbolgraph/GStreamer.symbols.json' -print -quit)"
          if [[ -z "$symbol_graph" ]]; then
            echo "GStreamer.symbols.json was not generated"
            exit 1
          fi
          echo "Found symbol graph: $symbol_graph"
